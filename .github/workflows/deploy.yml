name: Deploy

# Requires a self-hosted runner on the server (see deploy/README.md). Inactive until one exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build and (re)start
        run: docker compose up -d --build --remove-orphans
      - name: Status
        run: docker compose ps
      - name: Prune old images
        run: docker image prune -f
